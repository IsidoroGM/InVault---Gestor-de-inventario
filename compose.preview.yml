name: invault-preview

services:
  gateway:
    profiles:
      - production-gateway

  frontend:
    ports:
      - "127.0.0.1:${PREVIEW_HTTP_PORT:-8088}:8080"

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
