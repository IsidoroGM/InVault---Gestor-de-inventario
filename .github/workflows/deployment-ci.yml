name: Deployment CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - Dockerfile
      - .dockerignore
      - compose.prod.yml
      - compose.preview.yml
      - .env.production.example
      - frontend/Dockerfile
      - frontend/.dockerignore
      - frontend/angular.json
      - frontend/docker/**
      - frontend/ngsw-config.json
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/public/**
      - frontend/src/**
      - frontend/e2e/**
      - frontend/playwright.config.mjs
      - deploy/**
      - pom.xml
      - src/**
      - .github/workflows/deployment-ci.yml
  pull_request:
    branches:
      - main
      - develop
    paths:
      - Dockerfile
      - .dockerignore
      - compose.prod.yml
      - compose.preview.yml
      - .env.production.example
      - frontend/Dockerfile
      - frontend/.dockerignore
      - frontend/angular.json
      - frontend/docker/**
      - frontend/ngsw-config.json
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/public/**
      - frontend/src/**
      - frontend/e2e/**
      - frontend/playwright.config.mjs
      - deploy/**
      - pom.xml
      - src/**
      - .github/workflows/deployment-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Validate Compose and build images
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node for browser and load verification
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked browser test dependencies
        run: npm --prefix frontend ci

      - name: Verify fail-closed security report policies
        run: node --test deploy/tests/security-policy.test.mjs

      - name: Validate production Compose model
        run: docker compose --env-file .env.production.example --file compose.prod.yml config --quiet

      - name: Validate HTTPS preview Compose model
        run: docker compose --env-file .env.production.example --file compose.prod.yml --file compose.preview.yml config --quiet

      - name: Verify independent company deployment configurations
        shell: pwsh
        run: ./deploy/tests/company-isolation.ps1

      - name: Verify company configuration and runtime diagnostics
        shell: pwsh
        run: ./deploy/tests/company-status.ps1

      - name: Verify release identity rules
        shell: pwsh
        run: ./deploy/tests/release-identity.ps1

      - name: Install verified age encryption tools
        shell: pwsh
        run: ./deploy/install-age.ps1 -Destination "${{ runner.temp }}/invault-age"

      - name: Verify company backup monitoring
        shell: pwsh
        run: ./deploy/tests/backup-status.ps1

      - name: Verify encrypted backup and isolated company recovery
        shell: pwsh
        run: ./deploy/tests/backup-recovery.ps1 -AgeDirectory "${{ runner.temp }}/invault-age/age"

      - name: Build identified release images
        id: release
        shell: pwsh
        run: |
          $release = ./deploy/tests/build-release.ps1 -OutputDirectory "${{ runner.temp }}/invault-release"
          "backend=$($release.BackendImage)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "frontend=$($release.FrontendImage)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "revision=$($release.Revision)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Verify login limits through the production proxy chain
        shell: pwsh
        run: >-
          ./deploy/tests/login-security.ps1
          -BackendImage '${{ steps.release.outputs.backend }}'
          -FrontendImage '${{ steps.release.outputs.frontend }}'
          -ExpectedRevision '${{ steps.release.outputs.revision }}'
          -AgeDirectory '${{ runner.temp }}/invault-age/age'

      - name: Install browser engines
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Verify browser flows and bounded concurrent workload
        shell: pwsh
        run: >-
          ./deploy/tests/quality-stack.ps1
          -BackendImage '${{ steps.release.outputs.backend }}'
          -FrontendImage '${{ steps.release.outputs.frontend }}'
          -ExpectedRevision '${{ steps.release.outputs.revision }}'
          -ReportDirectory '${{ runner.temp }}/invault-quality-report'

      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.1
          cache: true

      - name: Analyze complete backend and frontend image inventories
        run: |
          mkdir -p '${{ runner.temp }}/invault-quality-report'
          trivy image --scanners vuln --list-all-pkgs --timeout 10m --format json --output '${{ runner.temp }}/invault-quality-report/backend-security.json' '${{ steps.release.outputs.backend }}'
          trivy image --scanners vuln --list-all-pkgs --timeout 10m --format json --output '${{ runner.temp }}/invault-quality-report/frontend-security.json' '${{ steps.release.outputs.frontend }}'

      - name: Block fixable high and critical image vulnerabilities
        run: |
          status=0
          node deploy/tests/security-policy.mjs '${{ runner.temp }}/invault-quality-report/backend-security.json' backend || status=1
          node deploy/tests/security-policy.mjs '${{ runner.temp }}/invault-quality-report/frontend-security.json' frontend || status=1
          exit "$status"

      - name: Retain disposable quality reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-reports
          path: ${{ runner.temp }}/invault-quality-report
          if-no-files-found: ignore
          retention-days: 14
