spring:
  datasource:
    url: jdbc:h2:mem:invault_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

    properties:
      hibernate:
        format_sql: false

invault:
  security:
    jwt:
      # Fixed test-only value: Base64 of a 32-byte non-production secret.
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      expiration: 5m
