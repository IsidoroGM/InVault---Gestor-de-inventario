spring:
  application:
    name: invault-backend

  profiles:
    default: dev

  lifecycle:
    timeout-per-shutdown-phase: 30s

  flyway:
    # Development keeps the pre-existing Hibernate-managed database compatible.
    # Production explicitly enables the versioned migrations below.
    enabled: false

  jpa:
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true

invault:
  cors:
    allowed-origins: ${INVAULT_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  realtime:
    allowed-origins: ${INVAULT_REALTIME_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    login-rate-limit:
      account-attempts: ${INVAULT_LOGIN_ACCOUNT_ATTEMPTS:10}
      ip-attempts: ${INVAULT_LOGIN_IP_ATTEMPTS:50}
      window: ${INVAULT_LOGIN_WINDOW:5m}
    jwt:
      issuer: ${INVAULT_JWT_ISSUER:https://api.invault.local}
      expiration: ${INVAULT_JWT_EXPIRATION:30m}
    bootstrap-admin:
      enabled: ${INVAULT_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${INVAULT_BOOTSTRAP_ADMIN_USERNAME:}
      email: ${INVAULT_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${INVAULT_BOOTSTRAP_ADMIN_PASSWORD:}
