spring:
  datasource:
    url: jdbc:mysql://localhost:3306/invault_inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid
    username: invault_admin
    password: CHANGE_ME
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Development only.
      # Allows Hibernate to create/update tables from JPA entities while the model is still evolving.
      # Do not use this strategy in production.
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

invault:
  realtime:
    # Comma-separated browser origins allowed to open the WebSocket connection.
    allowed-origins: ${INVAULT_REALTIME_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      # Base64-encoded secret containing at least 32 random bytes.
      # Keep the real value in the INVAULT_JWT_SECRET environment variable.
      secret: ${INVAULT_JWT_SECRET}
    bootstrap-admin:
      # Optional one-time bootstrap. The account is not modified if it already exists.
      enabled: ${INVAULT_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${INVAULT_BOOTSTRAP_ADMIN_USERNAME:}
      email: ${INVAULT_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${INVAULT_BOOTSTRAP_ADMIN_PASSWORD:}
